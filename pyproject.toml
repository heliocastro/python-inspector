[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-inspector"
version = "0.13.0"
description = "python-inspector is is a collection of utilities to collect PyPI package metadata and resolve packages dependencies."
authors = [
    { name="nexB. Inc. and others", email="info@aboutcode.org"},
    { name="Helio Chissini de Castro", email="helio.chissini.de.castro@cariad.technology" },
]
maintainers = [
    { name="nexB. Inc. and others", email="info@aboutcode.org"},
    { name ="Helio Chissini de Castro", email="helio.chissini.de.castro@cariad.technology" },
]
readme = "README.rst"
license = "Apache-2.0"
license-files = [
    "apache-2.0.LICENSE",
    "NOTICE",
    "AUTHORS.rst",
    "CHANGELOG.rst",
    "CODE_OF_CONDUCT.rst",
]
requires-python = ">= 3.11"
keywords = [
    "dependencies",
    "dependency resolution",
    "dependency",
    "open source",
    "package",
    "pip",
    "pypi",
    "python",
    "requirements",
    "resolvelib",
    "resolver",
    "SBOM",
    "sca",
    "scan",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1.8",
    "colorama>=0.4.6",
    "commoncode>=32.1.0",
    "dparse2>=0.7.0",
    "importlib-metadata>=8.5.0",
    "license-expression>=30.4.1",
    "mock>=5.1.0",
    "packageurl-python>=0.16.0",
    "packvers>=21.5",
    "pip-requirements-parser>=32.0.1",
    "pkginfo2>=30.0.0",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.7.1",
    "resolvelib>=1.1.0",
    "rich>=13.9.4",
    "tenacity>=9.0.0",
    "toml>=0.10.2",
    "typecode>=30.0.2",
]

[project.urls]
"Homepage" = "https://github.com/aboutcode-org/python-inspector"


[dependency-groups]
dev = [
    "mypy>=1.14.1",
    "pre-commit>=4.0.1",
    "pycodestyle>=2.12.1",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.2",
    "types-requests>=2.32.0.20241016",
    "types-toml>=0.10.8.20240310",
]

[project.scripts]
python-inspector = "python_inspector.resolve_cli:resolve_dependencies"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
log_cli = true
log_cli_level = "INFO"
pythonpath = "src"

[tool.pylint.messages_control]
disable = [
    "abstract-method",
    "arguments-differ",
    "attribute-defined-outside-init",
    "blacklisted-name",
    "chained-comparison",
    "duplicate-code",
    "eval-used",
    "exec-used",
    "expression-not-assigned",
    "fixme",
    "global-statement",
    "invalid-name",
    "import-error",
    "logging-fstring-interpolation",
    "missing-docstring",
    "no-member",
    "no-name-in-module",
    "protected-access",
    "redefined-argument-from-local",
    "redefined-outer-name",
    "reimported",
    "stop-iteration-return",
    "too-few-public-methods",
    "too-many-ancestors",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-return-statements",
    "too-many-statements",
    "unexpected-special-method-signature",
    "unspecified-encoding",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
follow_imports = "normal"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
fix = true
line-length = 120

# Exclude a variety of commonly ignored directories.
extend-exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Assume Python 3.10.
target-version = "py310"

[tool.ruff.lint]
extend-select = [
    "E",   # pycodestyle error
    "W",   # pycodestyle warning
    "F",   # pyflakes
    "A",   # flakes8-builtins
    "COM", # flakes8-commas
    "C4",  # flake8-comprehensions
    "Q",   # flake8-quotes
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "I",   # isort
    "N",   # pep8 naming
    "UP",  # pyupgrade
    "S",   # bandit
]
ignore = [
    'N802',   # function name should be lowercase
    'SIM105', # Suggest contextlib instead of try/except with pass
    'COM812', # missing-trailing-comma from flake8-commas
]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
flake8-tidy-imports.ban-relative-imports = "all"
isort.required-imports = ["from __future__ import annotations"]
# Unlike Flake8, default to a complexity level of 10.
mccabe.max-complexity = 10
per-file-ignores = {}

[tool.pyright]
reportUnboundVariable = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "python-inspector-cariad"
version = "1.12.1.99"
description = "Cariad Python INspector version"
authors = [
    "Helio Chissini de Castro <helio.chissini.de.castro@cariad.technology>",
]
maintainers = [
    "Helio Chissini de Castro <helio.chissini.de.castro@cariad.technology>",
]
license = "Apache 2.0"
packages = [{ include = "python_inspector", from = "src" },{ include = "_packagedcode", from = "src"} ]
keywords = ["python-inspector", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = "^3.10"
click = "^8.1.7"
toml = "^0.10.2"
rich = "^13.9.2"
pydantic = "^2.9.2"
packageurl-python = "^0.15.6"
packvers = "^21.5"
resolvelib = "^1.0.1"
pip-requirements-parser = "^32.0.1"
commoncode = "^32.0.0"
typecode = "^30.0.2"
license-expression = "^30.3.1"
colorama = "^0.4.6"

[tool.poetry.group.dev.dependencies]
mypy = "^1.11.2"
pre-commit = "^4.0.0"
pycodestyle = "^2.12.1"
types-toml = "^0.10.8.20240310"
pytest-cov = "^5.0.0"
ruff = "^0.6.9"

[tool.poetry.scripts]
python-inspector = "python_inspector.resolve_cli:resolve_dependencies"

[tool.setuptools_scm]
# this is used populated when creating a git archive
# and when there is .git dir and/or there is no git installed
fallback_version = "9999.9999.99"

[tool.pytest.ini_options]
pythonpath = "src"
python_files = "*.py"
python_classes = "Test"
python_functions = "test"
log_cli = true
log_cli_level = "INFO"

addopts = [
    "-rfExXw",
    "--strict-markers",
    "--doctest-modules",
    "--import-mode=importlib"
]

[[tool.poetry.source]]
name = "cariad"
url = "https://jfrog.hub.vwgroup.com/artifactory/api/pypi/optima-pypi-virtual/simple"
priority = "primary"

[tool.pylint.messages_control]
disable = [
    "abstract-method",
    "arguments-differ",
    "attribute-defined-outside-init",
    "blacklisted-name",
    "chained-comparison",
    "duplicate-code",
    "eval-used",
    "exec-used",
    "expression-not-assigned",
    "fixme",
    "global-statement",
    "invalid-name",
    "import-error",
    "logging-fstring-interpolation",
    "missing-docstring",
    "no-member",
    "no-name-in-module",
    "protected-access",
    "redefined-argument-from-local",
    "redefined-outer-name",
    "reimported",
    "stop-iteration-return",
    "too-few-public-methods",
    "too-many-ancestors",
    "too-many-arguments",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-lines",
    "too-many-locals",
    "too-many-return-statements",
    "too-many-statements",
    "unexpected-special-method-signature",
    "unspecified-encoding",
]

[tool.mypy]
follow_imports = "normal"
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
fix = true
line-length = 120
lint.ignore = []
lint.extend-select = [
    "E",   # pycodestyle error
    "W",   # pycodestyle warning
    "F",   # pyflakes
    "A",   # flakes8-builtins
    "COM", # flakes8-commas
    "C4",  # flake8-comprehensions
    "Q",   # flake8-quotes
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib
    "I",   # isort
    "N",   # pep8 naming
    "UP",  # pyupgrade
    "S",   # bandit
]

# Exclude a variety of commonly ignored directories.
extend-exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.10.
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
case-sensitive = true
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
